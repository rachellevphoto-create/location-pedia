services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: photoloc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: photoloc
      POSTGRES_PASSWORD: photoloc
      POSTGRES_DB: photoloc
    ports:
      - "5432:5432"
    volumes:
      - photoloc_pgdata:/var/lib/postgresql/data

volumes:
  photoloc_pgdata:
