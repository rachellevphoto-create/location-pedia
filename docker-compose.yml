services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: locatepedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: locatepedia
      POSTGRES_PASSWORD: locatepedia
      POSTGRES_DB: locatepedia
    ports:
      - "5432:5432"
    volumes:
      - locatepedia_pgdata:/var/lib/postgresql/data

volumes:
  locatepedia_pgdata:
